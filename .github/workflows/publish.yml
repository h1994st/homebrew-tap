name: Publish bottles

# Bottles are built by the CI run on a pull request and uploaded there as
# artifacts. This takes those artifacts, writes the `bottle do` block into the
# formula, attaches the bottle files to a release in this repository, pushes to
# `main` and closes the pull request.
#
# The pull request is not merged first: `brew pr-pull` does the merging itself,
# so it has to still be open when this runs.
on:
  # Label a green pull request `pr-pull` to publish it. `pull_request_target`
  # runs the workflow from `main` with a write token, which is what lets it
  # push -- the pull request's own code is never executed here, only its
  # commits cherry-picked and its bottle artifacts downloaded.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the pull request whose bottles to publish
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'pr-pull'
    runs-on: ubuntu-24.04
    env:
      PR: ${{ inputs.pull_request || github.event.pull_request.number }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Configure git identity
        uses: Homebrew/actions/git-user-config@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Tap this repository
        run: brew tap "$GITHUB_REPOSITORY_OWNER/tap"

      # Downloads the bottle artifacts the CI run attached to the pull request,
      # cherry-picks its commits, writes the `bottle do` block, and uploads the
      # bottle files.
      #
      # No `--root-url`: it would be honoured for the upload but not for the
      # formula. `brew bottle --merge` takes the root URL from the bottle JSON
      # (`dev-cmd/bottle.rb`, `bottle.root_url bottle_hash["bottle"]["root_url"]`)
      # and ignores the flag, while `pr-upload` rewrites the hash it uploads
      # with. Passing it therefore writes one URL into the formula and uploads
      # to another, leaving the recorded bottles at addresses that hold nothing.
      #
      # Left alone, both sides use what `brew test-bot` recorded: a release per
      # version, `<repo>/releases/download/<formula>-<version>`. It does not
      # need to exist beforehand -- `GitHubReleases#upload_bottles` creates it.
      - name: Pull bottles from the pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          brew pr-pull \
            --debug \
            --tap="$GITHUB_REPOSITORY_OWNER/tap" \
            "$PR"

      # The remote is named explicitly rather than trusting whatever the tap
      # clone carries -- how it was cloned is not this workflow's to assume, and
      # a push that cannot authenticate would fail after the bottles are already
      # uploaded.
      #
      # Authentication goes through `gh` as git's credential helper, so the
      # token stays in the environment. In a URL it would reach the process list
      # and any error message git prints, leaving Actions' log masking as the
      # only thing between it and the run log -- and masking only holds while
      # the value appears verbatim.
      - name: Push the bottle commit
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          tap_dir="$(brew --repo "$GITHUB_REPOSITORY_OWNER/tap")"
          git -C "$tap_dir" push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:main
